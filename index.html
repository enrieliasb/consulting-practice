<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case interview practice</title>
  <meta name="description" content="Timed case-opening drills for SMU Consulting Club members. Recap, structure, explain, then compare with a strong example." />
  <style>
    :root {
      --smu-blue: #354CA1;
      --smu-red: #CC0035;
      --gold: #F9C80E;
      --blue-ink: #202F68;
      --wash: #EEF1FA;
      --beginner: #B7C1E7;
      --surface: #FFFFFF;
      --canvas: #F6F7FB;
      --line: #E2E5EF;
      --ink: #202432;
      --muted: #687083;
      --white: #ffffff;
      --shadow: 0 18px 50px rgba(32, 47, 104, .09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: var(--canvas); }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% -18%, #E7EBFA 0, transparent 50%), var(--canvas);
    }

    .triangle {
      position: fixed; top: 0; right: 0; width: 0; height: 0;
      border-top: 74px solid var(--smu-red); border-left: 74px solid transparent;
      z-index: 5; pointer-events: none;
    }
    header {
      min-height: 76px; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px max(28px, calc((100vw - 1120px) / 2));
      border-bottom: 1px solid rgba(53, 76, 161, .1); background: rgba(255,255,255,.82);
      backdrop-filter: blur(12px);
    }
    .header-brand { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
    .wordmark-smu {
      font-weight: 900; letter-spacing: .07em; font-size: 23px; color: var(--smu-blue);
      line-height: 1; padding-right: 13px; border-right: 1px solid var(--line);
    }
    .wordmark-club { font-weight: 700; font-size: 12px; color: var(--blue-ink); letter-spacing: .035em; }
    main { width: min(100% - 40px, 900px); margin: 0 auto; padding: 48px 0 76px; }

    h1 { font-size: clamp(32px, 5vw, 46px); line-height: 1.08; letter-spacing: -.04em; color: var(--blue-ink); margin-bottom: 14px; }
    h2 { font-size: 22px; color: var(--blue-ink); margin-bottom: 10px; }
    p, li { font-size: 16px; line-height: 1.7; color: var(--ink); }
    .lede { color: var(--muted); max-width: 660px; margin-bottom: 26px; font-size: 17px; }

    #app > h1, #app > .lede, #app > .steps, #app > .actions, #app > .note { position: relative; }
    #app > h1::before {
      content: "SMU CONSULTING CLUB  /  CASE INTERVIEW PRACTICE"; display: block;
      color: var(--smu-red); font-size: 11px; font-weight: 800; letter-spacing: .13em;
      margin-bottom: 15px;
    }
    #app > h1 { margin-top: 14px; }
    .steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 32px 0 28px; }
    .step {
      min-height: 116px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 19px; display: grid; grid-template-columns: 42px 1fr; gap: 14px; align-items: start;
      box-shadow: 0 5px 18px rgba(32,47,104,.035); color: var(--muted); font-size: 14px; line-height: 1.55;
    }
    .step b { display: block; color: var(--blue-ink); font-size: 13px; letter-spacing: .04em; margin: 1px 0 5px; }
    .num {
      background: var(--wash); color: var(--smu-blue); border-radius: 12px; font-weight: 800;
      width: 40px; height: 40px; display: grid; place-items: center;
    }
    .step:nth-child(1) .num, .step:nth-child(4) .num { background: #FCE8EE; color: var(--smu-red); }

    .stage-bar {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
      margin: 0 auto 26px; padding: 22px 26px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 18px; box-shadow: var(--shadow); text-align: left;
    }
    .stage-left { display: flex; flex-direction: column; align-items: flex-start; gap: 15px; }
    .phase-label {
      display: inline-block; color: var(--blue-ink); font-size: clamp(21px, 4vw, 27px); font-weight: 800;
      letter-spacing: -.025em; line-height: 1.15;
    }
    .phase-label::before { content: "YOUR NEXT STEP"; display: block; color: var(--smu-red); font-size: 10px; letter-spacing: .14em; margin-bottom: 8px; }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dot { width: 25px; height: 5px; border-radius: 10px; background: #E1E5F0; }
    .dot.on { background: var(--smu-red); width: 34px; }
    .dot.done { background: var(--smu-blue); }
    .timer {
      font-variant-numeric: tabular-nums; font-weight: 800; font-size: clamp(42px, 7vw, 58px);
      letter-spacing: -.055em; color: var(--smu-blue); line-height: 1; margin: 0; padding: 15px 18px;
      background: var(--wash); border-radius: 14px; min-width: 148px; text-align: center;
    }
    .timer::after { content: "REMAINING"; display: block; font-size: 9px; letter-spacing: .16em; margin-top: 7px; color: var(--muted); }
    .timer.warn { color: var(--smu-red); background: #FFF0F3; }
    .stage-bar .actions { grid-column: 1 / -1; justify-content: flex-start; margin: 0; padding-top: 17px; border-top: 1px solid var(--line); }

    .prompt-card {
      background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--gold);
      border-radius: 14px; padding: clamp(22px, 4vw, 34px); font-size: 18px; line-height: 1.75;
      box-shadow: 0 8px 30px rgba(32,47,104,.05);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; justify-content: center; }
    button { font-family: inherit; cursor: pointer; border: 0; transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .btn-home { background: transparent; color: var(--smu-blue); font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 10px 14px; border-radius: 9px; }
    .btn-home:hover { background: var(--wash); color: var(--smu-red); }
    .btn-primary {
      background: var(--smu-red); color: var(--white); font-weight: 800; font-size: 14px;
      letter-spacing: .055em; text-transform: uppercase; padding: 15px 23px; border-radius: 10px;
      box-shadow: 0 7px 16px rgba(204,0,53,.19);
    }
    .btn-primary:hover { background: #B90030; transform: translateY(-1px); box-shadow: 0 10px 20px rgba(204,0,53,.24); }
    .debrief { display: grid; gap: 13px; margin: 0 0 28px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 22px 24px; box-shadow: 0 5px 20px rgba(32,47,104,.035); }
    .card h3 { color: var(--smu-red); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 9px; }
    .card ul { padding-left: 20px; }
    .card li { margin: 6px 0; }
    .card p + p { margin-top: 10px; }
    .bucket { margin: 17px 0 0; padding: 16px 18px; background: var(--canvas); border-radius: 10px; }
    .bucket-name { font-weight: 800; color: var(--blue-ink); margin-bottom: 5px; }
    .note { font-size: 13px; color: var(--muted); margin-top: 16px; text-align: center; }

    @media (max-width: 640px) {
      header { min-height: 66px; padding: 12px 20px; }
      .wordmark-smu { font-size: 20px; }
      .wordmark-club { max-width: 190px; font-size: 10px; }
      .triangle { border-top-width: 54px; border-left-width: 54px; }
      main { width: min(100% - 32px, 900px); padding: 34px 0 52px; }
      .steps { grid-template-columns: 1fr; margin-top: 24px; gap: 9px; }
      .step { min-height: 0; padding: 15px; }
      .stage-bar { grid-template-columns: 1fr auto; gap: 12px; padding: 18px; margin-bottom: 18px; }
      .timer { min-width: 100px; padding: 13px 11px; font-size: 39px; }
      .phase-label { font-size: 21px; }
      .dot { width: 19px; }
      .dot.on { width: 27px; }
      .prompt-card { font-size: 16px; padding: 21px; }
      .card { padding: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }

    /* Editorial SMU direction: confident navy, warm paper, and a restrained red accent. */
    :root { --canvas: #F3F2EF; --surface: #fff; --line: #E4E1DC; --blue-ink: #17285D; --smu-blue: #354CA1; --smu-red: #C8102E; --wash: #EEF0F7; --shadow: 0 14px 38px rgba(23,40,93,.08); }
    body { background: var(--canvas); }
    header { background: var(--blue-ink); border: 0; color: white; }
    .wordmark-smu { color: white; border-color: rgba(255,255,255,.28); }
    .wordmark-club { color: #E8EAF3; }
    .btn-home { color: white; }
    .btn-home:hover { color: white; background: rgba(255,255,255,.12); }
    .triangle { display: none; }
    main { width: min(100% - 48px, 1040px); padding-top: 54px; }
    #app > .home-hero {
      position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr 260px; align-items: center; gap: 36px;
      padding: 46px 48px; color: white; background: var(--blue-ink); border-radius: 22px;
      box-shadow: 0 22px 55px rgba(23,40,93,.17); margin-bottom: 36px;
    }
    .home-hero::before { content: ""; position: absolute; width: 300px; height: 300px; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; right: 110px; top: -170px; }
    .home-hero::after { content: ""; position: absolute; width: 190px; height: 190px; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; right: -65px; bottom: -115px; }
    .hero-copy, .hero-side { position: relative; z-index: 1; }
    .hero-kicker { display: block; color: #F5CF48; font-size: 10px; font-weight: 800; letter-spacing: .16em; margin-bottom: 15px; }
    #app .home-hero h1 { color: white; font-family: Georgia, "Times New Roman", serif; font-size: clamp(38px, 5.3vw, 56px); letter-spacing: -.04em; margin: 0 0 14px; }
    #app .home-hero h1::before { display: none; }
    #app .home-hero .lede { color: #D9DEED; font-size: 16px; max-width: 530px; margin: 0; }
    .hero-side { border-left: 1px solid rgba(255,255,255,.23); padding-left: 30px; }
    .hero-stat { color: #F5CF48; font-family: Georgia, serif; font-size: 42px; line-height: 1; }
    .hero-stat-label { color: #D9DEED; font-size: 12px; line-height: 1.5; margin-top: 9px; }
    .flow-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 0 2px 15px; }
    .flow-heading h2 { font-size: 19px; margin: 0; letter-spacing: -.02em; }
    .flow-heading span { color: var(--muted); font-size: 12px; }
    .steps { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; margin: 0 0 24px; background: white; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; }
    .step { min-height: 158px; display: block; position: relative; border: 0; border-right: 1px solid var(--line); border-radius: 0; padding: 18px; box-shadow: none; background: white; }
    .step:last-child { border-right: 0; }
    .step .num { width: 29px; height: 29px; border-radius: 50%; font-size: 12px; margin-bottom: 14px; background: var(--blue-ink); color: white; }
    .step:nth-child(1) .num, .step:nth-child(4) .num { background: var(--blue-ink); color: white; }
    .step b { font-size: 12px; line-height: 1.4; min-height: 34px; }
    .step { font-size: 12px; line-height: 1.55; }
    #app > .actions { justify-content: flex-start; margin-top: 0; }
    #app > .actions .btn-primary { min-width: 190px; }
    #app > .note { text-align: left; margin-top: 12px; }
    .steps { display: flex; flex-direction: column; gap: 0; border: 0; border-radius: 0; background: transparent; overflow: visible; margin-bottom: 24px; }
    .step {
      min-height: 0; display: grid; grid-template-columns: 42px minmax(185px, .75fr) 1.25fr; align-items: center;
      gap: 18px; padding: 17px 8px; border: 0; border-bottom: 1px solid #D9D6D0; border-radius: 0;
      background: transparent; box-shadow: none; font-size: 13px; color: var(--muted);
    }
    .step:first-child { border-top: 1px solid #D9D6D0; }
    .step .num, .step:nth-child(1) .num, .step:nth-child(4) .num {
      width: 32px; height: 32px; margin: 0; border-radius: 50%; background: white;
      border: 1px solid #C8C5BE; color: var(--blue-ink); font-size: 12px;
    }
    .step b { min-height: 0; margin: 0; font-size: 13px; color: var(--blue-ink); }
    .steps .step:last-child { margin-top: 0; padding: 17px 8px; background: transparent; border: 0; border-bottom: 1px solid #e8e8ed; border-radius: 0; font-style: italic; }
    .steps .step:last-child .num { font-style: normal; }
    .stage-bar { border-radius: 15px; padding: 20px 24px; box-shadow: 0 5px 20px rgba(23,40,93,.05); }
    .phase-label::before { letter-spacing: .12em; }
    .prompt-card { border-top: 0; border-left: 4px solid var(--smu-red); border-radius: 12px; font-size: 17px; }
    .card { box-shadow: 0 3px 14px rgba(23,40,93,.025); }
    @media (max-width: 700px) {
      main { width: min(100% - 32px, 1040px); padding-top: 30px; }
      #app > .home-hero { grid-template-columns: 1fr; gap: 24px; padding: 30px 26px; border-radius: 17px; }
      .hero-side { border-left: 0; border-top: 1px solid rgba(255,255,255,.23); padding: 17px 0 0; display: flex; align-items: center; gap: 13px; }
      .hero-stat { font-size: 32px; }
      .hero-stat-label { margin: 0; max-width: 185px; }
      .step { grid-template-columns: 34px 1fr; gap: 8px 13px; padding: 15px 4px; }
      .step > span { grid-column: 2; }
    }
    @media (max-width: 420px) { .flow-heading { display: block; } .flow-heading span { display: block; margin-top: 5px; } }

    /* Minimal, product-page inspired presentation while retaining SMU identity. */
    :root { --canvas: #fff; --surface: #fff; --line: #e8e8ed; --blue-ink: #1d1d1f; --ink: #1d1d1f; --muted: #6e6e73; --smu-blue: #354CA1; --smu-red: #C8102E; --wash: #f5f5f7; --shadow: 0 12px 35px rgba(0,0,0,.06); }
    body { background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    header { min-height: 52px; padding: 0 max(24px, calc((100vw - 1000px) / 2)); background: rgba(255,255,255,.88); border-bottom: 1px solid #e8e8ed; backdrop-filter: saturate(180%) blur(18px); }
    header { position: relative; }
    .mustang-mark { position: absolute; width: 36px; height: 36px; object-fit: contain; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .wordmark-smu { color: var(--smu-blue); border-color: #d2d2d7; font-size: 19px; }
    .smu-wordmark { display: block; width: 46px !important; height: 21px !important; object-fit: contain; padding: 0; border: 0; background: transparent; }
    .wordmark-club { color: #424245; font-weight: 500; }
    .btn-home { color: #424245; font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .btn-home:hover { color: var(--smu-blue); background: #f5f5f7; }
    main { width: min(100% - 48px, 980px); padding: 76px 0 90px; }
    #app > .home-hero { display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; color: var(--ink); background: white; box-shadow: none; border-radius: 0; margin: 0 auto 54px; padding: 4px 12px 0; }
    .home-hero::before, .home-hero::after { display: none; }
    .hero-copy, .hero-side { position: static; }
    .hero-kicker { color: var(--smu-red); font-size: 11px; letter-spacing: .12em; margin-bottom: 22px; }
    #app .home-hero h1 { color: #1d1d1f; font: 700 clamp(48px, 8vw, 82px)/.99 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: -.065em; margin: 0 auto 20px; max-width: 760px; }
    #app .home-hero h1 br { display: none; }
    #app .home-hero .lede { color: #6e6e73; font-size: clamp(18px, 2.3vw, 22px); line-height: 1.45; max-width: 620px; margin: 0 auto; }
    .hero-side { display: flex; align-items: baseline; gap: 8px; border: 0; padding: 18px 0 0; }
    .hero-stat { color: #424245; font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .hero-stat-label { color: #6e6e73; font-size: 13px; margin: 0; }
    .flow-heading { display: flex; flex-direction: column; align-items: center; margin: 0 0 15px; gap: 2px; text-align: center; }
    .flow-heading h2 { color: #1d1d1f; font-size: 23px; font-weight: 600; letter-spacing: -.025em; }
    .flow-heading span { color: #6e6e73; font-size: 14px; }
    .flow-heading p { color: #6e6e73; font-size: 12px; line-height: 1.4; margin: 0; }
    .flow-heading span { color: #6e6e73; font-size: 12px; }
    .flow-heading .flash-disclaimer { margin-top: 0; }
    .inline-link { display: inline; padding: 0; color: #06c; background: transparent; font: inherit !important; font-size: 12px !important; line-height: 1.4 !important; font-weight: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .inline-link:hover { color: #004fbd; }
    .inline-link:focus-visible { outline: 2px solid var(--smu-blue); outline-offset: 3px; border-radius: 2px; }
    .steps { max-width: 760px; margin: 0 auto 30px; }
    .step { grid-template-columns: 40px minmax(190px, .7fr) 1.3fr; gap: 20px; padding: 20px 4px; border-color: #e8e8ed; color: #6e6e73; font-size: 14px; }
    .step:first-child { border-color: #e8e8ed; }
    .step .num, .step:nth-child(1) .num, .step:nth-child(4) .num { width: 30px; height: 30px; border: 0; background: #f5f5f7; color: #424245; font-size: 12px; font-weight: 600; }
    .step b { color: #1d1d1f; font-size: 14px; font-weight: 600; }
    #app > .actions { justify-content: center; }
    .btn-primary { background: #0071e3; box-shadow: none; border-radius: 999px; padding: 12px 22px; font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; }

    .btn-secondary:hover { background: #e9e9ed; }
    #app > .note { text-align: center; color: #86868b; font-size: 12px; }

      background: #f5f5f7; border: 1px solid #e8e8ed; border-radius: 20px; box-shadow: none;
      padding: clamp(28px, 5vw, 54px); margin: 16px 0 24px;

    .practice-stage .phase-label { font-size: clamp(30px, 4.4vw, 42px); }

    .practice-stage .actions { justify-content: center; padding-top: 24px; }
    .practice-stage .btn-primary { width: 150px; padding: 16px 24px; font-size: 16px; }
    #advance-btn { width: 150px; }
    .phase-label { color: #1d1d1f; font-size: clamp(22px, 4vw, 28px); font-weight: 600; letter-spacing: -.035em; }
    .phase-label::before { font-size: 10px; color: var(--smu-red); }
    .timer { border-radius: 14px; background: #f5f5f7; color: var(--smu-blue); font-size: 46px; font-weight: 600; letter-spacing: -.05em; }
    .timer::after { font-weight: 600; }
    .timer.warn { background: #fff1f2; color: var(--smu-red); }
    .timer.caution { color: #8A6500; background: #FFF7DB; }
    .timer.urgent { color: var(--smu-red); background: #FFF0F3; animation: timer-pulse .85s ease-in-out infinite; }
    @keyframes timer-pulse { 50% { transform: scale(1.035); box-shadow: 0 0 0 7px rgba(200,16,46,.09); } }
    .time-up-notice {
      display: flex; align-items: center; gap: 12px; margin: 0 0 18px; padding: 15px 19px;
      color: #8F1028; background: #FFF0F3; border: 1px solid #F2C3CD; border-left: 5px solid var(--smu-red);

      animation: notice-in .2s ease-out both;
    }

    .time-up-notice.is-hidden { opacity: 0; transform: translateY(-5px); transition: opacity .25s ease, transform .25s ease; }
    @keyframes notice-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .screen-flash {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
      background: rgba(200, 16, 46, .22); animation: screen-flash-once 650ms cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes screen-flash-once { from { opacity: 1; } to { opacity: 0; } }
    .completion-overlay {
      position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
      color: white; background: #27834F; animation: completion-overlay 3s ease-in-out both;
    }
    .completion-overlay span { font-size: clamp(38px, 7vw, 68px); font-weight: 700; letter-spacing: -.045em; }
    @keyframes completion-overlay {
      0% { opacity: 0; }
      16% { opacity: 1; }
      66% { opacity: 1; }
      100% { opacity: 0; }
    }
    .prompt-card { border: 0; background: #f5f5f7; border-radius: 18px; padding: clamp(24px, 5vw, 42px); font-size: 19px; line-height: 1.65; box-shadow: none; }
    .prompt-hint, .stage-hint {

    .filter-row {

    .filter-row select {

    .filters .filter-row { margin: 0; }
    @media (max-width: 700px) {
      main { width: min(100% - 36px, 980px); padding: 50px 0 64px; }
      header { gap: 8px; padding: 0 15px; }
      .mustang-mark { position: static; width: 30px; height: 30px; transform: none; margin-left: auto; flex: 0 0 auto; }
      .smu-wordmark { width: 42px !important; height: 20px !important; padding: 0; }

      .btn-home { flex: 0 0 auto; padding: 8px; }
      #app > .home-hero { padding: 0 0 4px; margin-bottom: 40px; }
      #app .home-hero h1 { font-size: clamp(46px, 13vw, 68px); }
      .step { grid-template-columns: 34px 1fr; gap: 7px 13px; padding: 16px 2px; }
      .step > span { grid-column: 2; }
      .stage-bar { grid-template-columns: 1fr auto; }
      .practice-stage { min-height: 300px; padding: 24px 20px; gap: 18px; }
      .practice-stage .phase-label { font-size: 28px; }
      .practice-stage .timer { min-width: 112px; padding: 16px 12px; font-size: 44px; }

    }
    .track-grid, .coming-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;

    }
    .track-card, .coming-card {
      display: block; width: 100%; text-align: left;

    }

    .home-story {

    .why-grid {

    .why-card {

    body.menu-open { overflow: hidden; }
    .nav-backdrop {
      position: fixed; inset: 0; z-index: 60;

    .nav-backdrop.is-open { opacity: 1; pointer-events: auto; }
    .nav-drawer {
      position: fixed; top: 0; right: 0; z-index: 61;
      width: min(360px, 88vw); height: 100%;
      display: flex; flex-direction: column; gap: 28px;
      padding: 20px 22px 32px;
      background: #fff;
      box-shadow: -18px 0 40px rgba(0, 0, 0, .08);
      transform: translateX(100%);
      transition: transform .32s cubic-bezier(.22, 1, .36, 1);
    }
    .nav-drawer.is-open { transform: translateX(0); }
    .nav-drawer-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .nav-drawer-top h2 {
      margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.02em; color: #1d1d1f;
    }
    .nav-close {
      background: transparent; color: #424245; font: inherit; font-size: 12px; font-weight: 500;
      padding: 8px 10px; border-radius: 9px; cursor: pointer;
    }
    .nav-close:hover { background: #f5f5f7; color: var(--smu-blue); }
    .nav-close:focus-visible, .nav-link:focus-visible {
      outline: 2px solid var(--smu-blue); outline-offset: 3px;
    }
    .nav-links { display: grid; gap: 8px; }
    .nav-link {
      display: block; width: 100%; text-align: left; cursor: pointer; font: inherit;
      background: #fff; border: 1px solid #e8e8ed; border-radius: 16px; padding: 18px 16px;
    }
    .nav-link:hover { background: #f5f5f7; }
    .nav-link b { display: block; color: #1d1d1f; font-size: 16px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 4px; }
    .nav-link span { display: block; color: #6e6e73; font-size: 13px; line-height: 1.4; }

    @media (prefers-reduced-motion: reduce) {
      .timer.urgent { animation: none; }
      .time-up-notice { animation: none; }
      .time-up-notice.is-hidden { transition: none; }
      .screen-flash { display: none; }
      .completion-overlay { animation: none; }

    /* Members-only gate (session unlock) */
    #gate {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;

    .gate-panel h1 {
      color: #1d1d1f; font-size: clamp(28px, 6vw, 36px); font-weight: 700;

      display: block; color: #424245; font-size: 13px; font-weight: 600; margin-bottom: 6px;

    .gate-form input[type="password"] {

      padding: 13px 14px; border: 1px solid #d2d2d7; border-radius: 12px; background: #fff;
    }
    .gate-form input[type="password"]:focus {
      outline: none; border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0, 113, 227, .18);
    }
    .gate-form .btn-primary { width: 100%; margin-top: 4px; }
    .gate-error {
      color: var(--smu-red); font-size: 13px; font-weight: 600; min-height: 1.2em; margin: 0;
    }
    .gate-error[hidden] { display: none; }
    .gate-note { color: #86868b; font-size: 12px; margin-top: 18px; text-align: center; }
    body.is-gated header,
    body.is-gated .nav-backdrop,
    body.is-gated .nav-drawer,
    body.is-gated main { visibility: hidden; }
  </style>
</head>
<body class="is-gated">
  <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate-panel">
      <span class="gate-kicker">SMU CONSULTING CLUB</span>
      <h1 id="gate-title">Members only</h1>
      <p class="lede">Enter the club password to open Framework Practice.</p>
      <form class="gate-form" id="gate-form" autocomplete="off">
        <div>
          <label for="gate-password">Password</label>
          <input id="gate-password" name="password" type="password" autocomplete="current-password" required autofocus />
        </div>
        <p class="gate-error" id="gate-error" hidden>Incorrect password. Try again.</p>
        <button class="btn-primary" type="submit">Enter</button>
      </form>
      <p class="gate-note">Shared with Consulting &amp; Corporate Strategy Club members.</p>
    </div>
  </div>
  <div class="triangle" aria-hidden="true"></div>
  <header>
    <div class="header-brand">
      <img class="smu-wordmark" src="https://www.smu.edu/-/media/site/brand/2022/logo-guidelines/general/smu-logo_formal_digitalonly_r.png?h=90&amp;hash=8E328458DB88522ED0F776C15F974712&amp;w=200" alt="SMU" />
      <span class="wordmark-club">Consulting &amp; Corporate Strategy Club</span>
    </div>
    <img class="mustang-mark" src="https://www.smu.edu/-/media/site/brand/2022/logo-guidelines/peruna/perunar.png?h=402&amp;hash=D34CA424D04C4D9B074AC7E1646133C3&amp;w=400" alt="SMU Mustang" />
    <button class="btn-home" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav-drawer">Menu</button>
  </header>
  <div class="nav-backdrop" id="nav-backdrop"></div>
  <aside class="nav-drawer" id="nav-drawer" role="dialog" aria-modal="true" aria-labelledby="nav-title" aria-hidden="true">
    <div class="nav-drawer-top">
      <h2 id="nav-title">Menu</h2>
      <button class="nav-close" id="nav-close-btn" type="button">Close</button>
    </div>
    <nav class="nav-links">
      <button class="nav-link" id="nav-home-btn" type="button"><b>Home</b><span>What this practice is for</span></button>
      <button class="nav-link" id="nav-front-btn" type="button"><b>Front half</b><span>Case opening</span></button>
      <button class="nav-link" id="nav-back-btn" type="button"><b>Back half</b><span>Math and creative</span></button>
    </nav>
  </aside>
  <main id="app"></main>
  <script>
    const USED_KEY = "frameworkPracticeUsedIds";
    const FLASH_KEY = "frameworkPracticeFlashEnabled";
    const AUTH_KEY = "frameworkPracticeUnlocked";
    const CASES_KEY = "frameworkPracticeCasesV2";
    const SEEN_OPENING_KEY = "frameworkPracticeSeenOpening";
    const SEEN_MATH_KEY = "frameworkPracticeSeenMath";
    const SEEN_CREATIVE_KEY = "frameworkPracticeSeenCreative";
    const TYPE_FILTER_KEY = "frameworkPracticeTypeFilter";
    const MATH_KIND_KEY = "frameworkPracticeMathKind";
    const SESSION_COUNT_KEY = "frameworkPracticeSessionCount";
    const MATH_USED_KEY = "frameworkPracticeMathUsedIds";
    const CREATIVE_USED_KEY = "frameworkPracticeCreativeUsedIds";
    const MATH_SESSION_KEY = "frameworkPracticeMathSessionCount";
    const CREATIVE_SESSION_KEY = "frameworkPracticeCreativeSessionCount";
    const PHASES = ["prompt", "recap", "framework", "explain", "debrief"];
    const BACK_PHASES = ["work", "debrief"];
    const DURATIONS = {
      recap: 90,
      framework: 135,
      explain: 120
    };

    const COPY = {
      recap: {
        label: "Recap & questions",
        hint: "Restate the problem out loud, then ask clarifying questions. Do not look at the prompt."
      },
      framework: {
        label: "Build your framework",
        hint: "Sketch MECE buckets on paper. Aim for a structure you can explain, not a full answer."
      },
      explain: {
        label: "Explain your framework",
        hint: "Walk through each bucket as if the interviewer is in the room."
      }
    };

    let currentCase = null;
    let currentMath = null;
    let phase = "home";
    let selectedType = "any";
    try { selectedType = sessionStorage.getItem(TYPE_FILTER_KEY) || "any"; } catch (e) {}
    let selectedMathKind = "any";
    try { selectedMathKind = sessionStorage.getItem(MATH_KIND_KEY) || "any"; } catch (e) {}
    let remaining = 0;
    let elapsed = 0;
    let timerId = null;
    let pendingTimeUpNotice = "";
    let flashEnabled = true;
    try { flashEnabled = localStorage.getItem(FLASH_KEY) !== "false"; } catch (e) {}
    const app = document.getElementById("app");

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m + ":" + String(s).padStart(2, "0");
    }

    function promptDuration(prompt) {
      const wordCount = String(prompt || "").trim().split(/\s+/).filter(Boolean).length;
      const estimatedSeconds = 12 + (wordCount * 60 / 238);
      return Math.max(30, Math.ceil(estimatedSeconds / 5) * 5);
    }

    function getUsedIds() {
      try {
        return JSON.parse(sessionStorage.getItem(USED_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function setUsedIds(ids) {
      sessionStorage.setItem(USED_KEY, JSON.stringify(ids));
    }

    function pickRandomCase() {
      const pool = Array.isArray(window.CASES) ? window.CASES : [];
      const typed = selectedType === "any"
        ? pool
        : pool.filter(function (c) { return c.type === selectedType; });
      const source = typed.length ? typed : pool;
      if (!source.length) return null;
      let used = getUsedIds();
      let available = source.filter(function (c) { return used.indexOf(c.id) === -1; });
      if (!available.length) {
        const sourceIds = source.map(function (c) { return c.id; });
        used = used.filter(function (id) { return sourceIds.indexOf(id) === -1; });
        available = source.slice();
      }
      const pick = available[Math.floor(Math.random() * available.length)];
      used.push(pick.id);
      setUsedIds(used);
      return pick;
    }

    function getStoredIds(key) {
      try {
        return JSON.parse(sessionStorage.getItem(key) || "[]");
      } catch (e) {
        return [];
      }
    }

    function setStoredIds(key, ids) {
      try { sessionStorage.setItem(key, JSON.stringify(ids)); } catch (e) {}
    }

    function mathPool() {
      const items = [];
      const cases = Array.isArray(window.CASES) ? window.CASES : [];
      cases.forEach(function (c) {
        (c.math || []).forEach(function (q, i) {
          if (selectedType !== "any" && c.type !== selectedType) return;
          if (selectedMathKind !== "any" && q.kind !== selectedMathKind) return;
          items.push({ id: c.id + ":math:" + i, case: c, question: q });
        });
      });
      return items;
    }

    function creativePool() {
      const cases = Array.isArray(window.CASES) ? window.CASES : [];
      const typed = selectedType === "any"
        ? cases
        : cases.filter(function (c) { return c.type === selectedType; });
      const withCreative = typed.filter(function (c) { return c.creative && c.creative.prompt; });
      return withCreative.length ? withCreative : cases.filter(function (c) { return c.creative && c.creative.prompt; });
    }

    function pickFromPool(pool, usedKey, idFn) {
      if (!pool.length) return null;
      let used = getStoredIds(usedKey);
      let available = pool.filter(function (item) { return used.indexOf(idFn(item)) === -1; });
      if (!available.length) {
        const ids = pool.map(idFn);
        used = used.filter(function (id) { return ids.indexOf(id) === -1; });
        available = pool.slice();
      }
      const pick = available[Math.floor(Math.random() * available.length)];
      used.push(idFn(pick));
      setStoredIds(usedKey, used);
      return pick;
    }

    function pickRandomMath() {
      let pool = mathPool();
      if (!pool.length && (selectedType !== "any" || selectedMathKind !== "any")) {
        const savedType = selectedType;
        const savedKind = selectedMathKind;
        selectedType = "any";
        selectedMathKind = "any";
        pool = mathPool();
        selectedType = savedType;
        selectedMathKind = savedKind;
      }
      return pickFromPool(pool, MATH_USED_KEY, function (item) { return item.id; });
    }

    function pickRandomCreative() {
      const pool = creativePool();
      return pickFromPool(pool, CREATIVE_USED_KEY, function (c) { return c.id; });
    }

    function caseTypes() {
      const pool = Array.isArray(window.CASES) ? window.CASES : [];
      const types = [];
      pool.forEach(function (c) {
        if (c.type && types.indexOf(c.type) === -1) types.push(c.type);
      });
      types.sort();
      return types;
    }

    function typeFilterHtml() {
      const options = ['<option value="any">Any type (random)</option>'].concat(
        caseTypes().map(function (type) {
          return '<option value="' + escapeHtml(type) + '"' +
            (type === selectedType ? " selected" : "") + ">" + escapeHtml(type) + "</option>";
        })
      );
      return (
        '<div class="filter-row"><label for="type-filter">Case type</label>' +
        '<select id="type-filter">' + options.join("") + "</select></div>"
      );
    }

    function bindTypeFilter() {
      const select = document.getElementById("type-filter");
      if (!select) return;
      if (selectedType !== "any" && !caseTypes().some(function (t) { return t === selectedType; })) {
        selectedType = "any";
        select.value = "any";
      }
      select.addEventListener("change", function () {
        selectedType = select.value || "any";
        try { sessionStorage.setItem(TYPE_FILTER_KEY, selectedType); } catch (e) {}
      });
    }

    function mathKindFilterHtml() {
      const options = [
        ["any", "Any math (random)"],
        ["definite", "Definite answer"],
        ["market-sizing", "Market sizing"]
      ].map(function (pair) {
        return '<option value="' + pair[0] + '"' +
          (pair[0] === selectedMathKind ? " selected" : "") + ">" + pair[1] + "</option>";
      });
      return (
        '<div class="filter-row"><label for="math-kind-filter">Math type</label>' +
        '<select id="math-kind-filter">' + options.join("") + "</select></div>"
      );
    }

    function bindMathKindFilter() {
      const select = document.getElementById("math-kind-filter");
      if (!select) return;
      select.addEventListener("change", function () {
        selectedMathKind = select.value || "any";
        try { sessionStorage.setItem(MATH_KIND_KEY, selectedMathKind); } catch (e) {}
      });
    }

    function getStoredCount(key) {
      try {
        return parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
      } catch (e) {
        return 0;
      }
    }

    function bumpStoredCount(key) {
      try { sessionStorage.setItem(key, String(getStoredCount(key) + 1)); } catch (e) {}
    }

    function getSessionCount() {
      return getStoredCount(SESSION_COUNT_KEY);
    }

    function bumpSessionCount() {
      bumpStoredCount(SESSION_COUNT_KEY);
    }

    function sessionNoteHtml(track) {
      if (track === "math") {
        const n = getStoredCount(MATH_SESSION_KEY);
        if (!n) return "";
        return '<p class="session-note">' + n + " math drill" + (n === 1 ? "" : "s") + " this sitting</p>";
      }
      if (track === "creative") {
        const n = getStoredCount(CREATIVE_SESSION_KEY);
        if (!n) return "";
        return '<p class="session-note">' + n + " creative drill" + (n === 1 ? "" : "s") + " this sitting</p>";
      }
      if (track === "opening") {
        const n = getSessionCount();
        if (!n) return "";
        return '<p class="session-note">' + n + " opening" + (n === 1 ? "" : "s") + " this sitting</p>";
      }
      const bits = [];
      const openings = getSessionCount();
      const maths = getStoredCount(MATH_SESSION_KEY);
      const creatives = getStoredCount(CREATIVE_SESSION_KEY);
      if (openings) bits.push(openings + " opening" + (openings === 1 ? "" : "s"));
      if (maths) bits.push(maths + " math");
      if (creatives) bits.push(creatives + " creative");
      if (!bits.length) return "";
      return '<p class="session-note">' + bits.join(" · ") + " this sitting</p>";
    }

    function hasSeenOpening() {
      try { return localStorage.getItem(SEEN_OPENING_KEY) === "1"; } catch (e) { return false; }
    }

    function markOpeningSeen() {
      try { localStorage.setItem(SEEN_OPENING_KEY, "1"); } catch (e) {}
    }

    function hasSeenMath() {
      try { return localStorage.getItem(SEEN_MATH_KEY) === "1"; } catch (e) { return false; }
    }

    function markMathSeen() {
      try { localStorage.setItem(SEEN_MATH_KEY, "1"); } catch (e) {}
    }

    function hasSeenCreative() {
      try { return localStorage.getItem(SEEN_CREATIVE_KEY) === "1"; } catch (e) { return false; }
    }

    function markCreativeSeen() {
      try { localStorage.setItem(SEEN_CREATIVE_KEY, "1"); } catch (e) {}
    }

    function isLiveDrill() {
      return ["prompt", "recap", "framework", "explain", "math-work", "creative-work"].indexOf(phase) !== -1;
    }

    function leaveDrill(nextFn) {
      if (!isLiveDrill()) {
        nextFn();
        return;
      }
      if (window.confirm("Leave this case? The timer will stop and you will lose this drill.")) {
        clearTimer();
        currentCase = null;
        currentMath = null;
        nextFn();
      }
    }

    function startOpeningFromHome() {
      if (hasSeenOpening()) startNewCase();
      else goFrontHalf();
    }

    function startMathFromHub() {
      if (hasSeenMath()) startNewMath();

    function clearTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function startTimer(seconds, onDone, nextLabel) {
      clearTimer();
      remaining = seconds;
      renderTimer();
      timerId = setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) {
          remaining = 0;
          renderTimer();
          clearTimer();
          if (nextLabel === "Compare your work") {
            pendingTimeUpNotice = "";
          } else {
            pendingTimeUpNotice = "Time’s up — " + nextLabel + " starts now.";
            triggerScreenFlash();
          }
          onDone();
          return;
        }
        renderTimer();
      }, 1000);
    }

    function startCountUpTimer() {
      clearTimer();
      elapsed = 0;
      renderCountUp();
      timerId = setInterval(function () {
        elapsed += 1;
        renderCountUp();
      }, 1000);
    }

    function renderTimer() {
      const el = document.getElementById("timer");
      if (!el) return;
      el.classList.remove("count-up");
      el.textContent = formatTime(remaining);
      el.classList.toggle("caution", remaining <= 15 && remaining > 5);
      el.classList.toggle("urgent", remaining <= 5);
    }

    function renderCountUp() {
      const el = document.getElementById("timer");
      if (!el) return;
      el.classList.add("count-up");
      el.textContent = formatTime(elapsed);
      el.classList.toggle("caution", elapsed >= 300 && elapsed < 360);
      el.classList.toggle("urgent", elapsed >= 360);
    }

    function timeUpNoticeHtml() {
      if (!pendingTimeUpNotice) return "";
      const message = pendingTimeUpNotice;
      pendingTimeUpNotice = "";
      setTimeout(function () {
        const notice = document.getElementById("time-up-notice");
        if (!notice) return;
        notice.classList.add("is-hidden");
        setTimeout(function () { notice.remove(); }, 280);
      }, 5000);
      return '<div class="time-up-notice" id="time-up-notice" role="status" aria-live="polite">' + escapeHtml(message) + "</div>";
    }

    function triggerScreenFlash() {
      if (!flashEnabled || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const flash = document.createElement("div");
      flash.className = "screen-flash";
      flash.setAttribute("aria-hidden", "true");
      document.body.appendChild(flash);
      setTimeout(function () { flash.remove(); }, 700);
    }

    function showCompletionOverlay() {
      const overlay = document.createElement("div");
      overlay.className = "completion-overlay";
      overlay.setAttribute("role", "status");
      overlay.setAttribute("aria-live", "polite");
      overlay.innerHTML = "<span>You’re done</span>";
      document.body.appendChild(overlay);
      setTimeout(function () { overlay.remove(); }, 3050);
    }

    function updateFlashToggle() {
      const toggle = document.getElementById("flash-toggle");
      if (!toggle) return;
      const copy = document.getElementById("flash-copy");
      if (copy) copy.textContent = flashEnabled ? "The screen flashes red briefly when time runs out." : "The timeout screen flash is off.";
      toggle.textContent = flashEnabled ? "Turn off flash" : "Turn on flash";
      toggle.setAttribute("aria-pressed", String(flashEnabled));
      toggle.setAttribute("aria-label", (flashEnabled ? "Turn off" : "Turn on") + " the timeout screen flash");
    }

    function trapMenuFocus(event) {
      if (event.key !== "Tab") return;
      const drawer = document.getElementById("nav-drawer");
      if (!drawer || !drawer.classList.contains("is-open")) return;
      const nodes = Array.prototype.slice.call(drawer.querySelectorAll("button")).filter(function (el) {
        return !el.disabled;
      });
      if (!nodes.length) return;
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    function setDrawerTabbable(open) {
      const drawer = document.getElementById("nav-drawer");
      if (!drawer) return;
      Array.prototype.forEach.call(drawer.querySelectorAll("button"), function (el) {
        if (open) el.removeAttribute("tabindex");
        else el.setAttribute("tabindex", "-1");
      });
    }

    function setMenuOpen(open) {
      const drawer = document.getElementById("nav-drawer");
      const backdrop = document.getElementById("nav-backdrop");
      const btn = document.getElementById("menu-btn");
      if (!drawer || !backdrop || !btn) return;
      const wasOpen = drawer.classList.contains("is-open");
      drawer.classList.toggle("is-open", open);
      backdrop.classList.toggle("is-open", open);
      drawer.setAttribute("aria-hidden", String(!open));
      drawer.inert = !open;
      btn.setAttribute("aria-expanded", String(open));
      document.body.classList.toggle("menu-open", open);
      setDrawerTabbable(open);
      document.removeEventListener("keydown", trapMenuFocus);
      if (open) {
        document.addEventListener("keydown", trapMenuFocus);
        const closeBtn = document.getElementById("nav-close-btn");
        if (closeBtn) closeBtn.focus();
      } else if (wasOpen) {
        btn.focus();
      }
    }

    function closeMenu() {
      setMenuOpen(false);
    }

    function bindNavDrawer() {
      const btn = document.getElementById("menu-btn");
      const backdrop = document.getElementById("nav-backdrop");
      const closeBtn = document.getElementById("nav-close-btn");
      const homeBtn = document.getElementById("nav-home-btn");
      const frontBtn = document.getElementById("nav-front-btn");
      const backBtn = document.getElementById("nav-back-btn");
      const drawer = document.getElementById("nav-drawer");
      if (drawer) drawer.inert = true;
      setDrawerTabbable(false);
      if (btn) {
        btn.addEventListener("click", function () {
          setMenuOpen(btn.getAttribute("aria-expanded") !== "true");
        });
      }
      if (backdrop) backdrop.addEventListener("click", closeMenu);
      if (closeBtn) closeBtn.addEventListener("click", closeMenu);
      if (homeBtn) {
        homeBtn.addEventListener("click", function () {
          closeMenu();
          leaveDrill(goMenu);
        });
      }
      if (frontBtn) {
        frontBtn.addEventListener("click", function () {
          closeMenu();
          leaveDrill(goFrontHalf);
        });
      }
      if (backBtn) {
        backBtn.addEventListener("click", function () {
          closeMenu();
          leaveDrill(goBackHalf);
        });
      }
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeMenu();
      });
    }

    function initApp() {
      goMenu();
      bindNavDrawer();
    }

    async function fetchCasesWithPassword(password) {
      const response = await fetch("/api/cases", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password })
      });
      if (response.status === 401) {
        return { ok: false, reason: "unauthorized" };
      }
      if (!response.ok) {
        return { ok: false, reason: "error" };
      }
      const data = await response.json();
      if (!data || !Array.isArray(data.cases)) {
        return { ok: false, reason: "error" };
      }
      return { ok: true, cases: data.cases };
    }

    async function handleGateSubmit(event) {
      event.preventDefault();
      const input = document.getElementById("gate-password");
      const error = document.getElementById("gate-error");
      const submitBtn = event.target.querySelector('button[type="submit"]');
      if (!input) return;
      if (submitBtn) submitBtn.disabled = true;
      if (error) {
        error.hidden = true;
        error.textContent = "Incorrect password. Try again.";
      }
      try {
        const result = await fetchCasesWithPassword(input.value);
        if (result.ok) {
          cacheCases(result.cases);
          hideGate();
          initApp();
          return;
        }
        if (error) {
          error.textContent = result.reason === "unauthorized"
            ? "Incorrect password. Try again."
            : "Could not unlock. Check the site setup and try again.";
          error.hidden = false;
        }
        input.value = "";
        input.focus();
      } catch (e) {
        if (error) {
          error.textContent = "Could not reach the server. Try again.";
          error.hidden = false;
        }
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    (async function boot() {
      if (isLocalPreview()) {
        try {
          const cases = await loadLocalCases();
          cacheCases(cases);
          hideGate();
          initApp();
        } catch (e) {
          const error = document.getElementById("gate-error");
          if (error) {
            error.textContent = "Local preview could not load cases. Refresh and try again.";
            error.hidden = false;
          }
        }
        return;
      }
      if (isSessionUnlocked()) {
        window.CASES = loadCachedCases();
        hideGate();
        initApp();
        return;
      }
      const form = document.getElementById("gate-form");
      if (form) form.addEventListener("submit", handleGateSubmit);
    })();
  </script>
</body>
</html>
